<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OpenDispatch app icon: a large circle with one quarter-circle wave around its top right, an ice
       front with a green trail on the circle and a pink trail on the wave, on a deep night-sky blue.
       Source for the PNGs in App/Openfeed/Resources/Assets.xcassets; regenerate with scripts/render-icons.sh. -->
  <style>
    use { fill: none; stroke-linecap: round; }
    .lay { mix-blend-mode: screen; }
    .r { stroke-width: 90; }
    .g { stroke-width: 84; }
    .l { stroke-width: 79; }
    .b { stroke-width: 73; }
    .r.cp { stroke: #ff5ad8; } .b.cp { stroke: #5a0c4c; }
    .dr.cg { fill: #8dff5a; } .db.cg { fill: #1f5a0c; }
    .fr .r { stroke: #eef4ff; } .fr .g { stroke: #16204a; } .fr .l { stroke: #d3e6ff; } .fr .b { stroke: url(#ice); }
    .fr .dr { fill: #eef4ff; } .fr .dg { fill: #16204a; } .fr .dl { fill: #d3e6ff; } .fr .db { fill: url(#ice); }
    .gl .b { stroke: url(#ice); } .gl .db { fill: url(#ice); }
  </style>
  <defs>
    <!-- The circle is filled, so its rim, gap, line and body are four nested circles; the wave gets the same rings as strokes. -->
    <circle id="rim" cx="385" cy="628" r="150"/>
    <circle id="gap" cx="385" cy="628" r="147"/>
    <circle id="line" cx="385" cy="628" r="144.5"/>
    <circle id="body" cx="385" cy="628" r="141.5"/>
    <path id="wave" d="M 385 328 A 300 300 0 0 1 685 628"/>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="240" y1="260" x2="780" y2="780">
      <stop offset="0" stop-color="#8cc3f2"/>
      <stop offset="0.6" stop-color="#b9c6f0"/>
      <stop offset="1" stop-color="#eadcf7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15234a"/>
      <stop offset="0.5" stop-color="#0c1533"/>
      <stop offset="1" stop-color="#060a1c"/>
    </linearGradient>
    <!-- Faint light along the top edge, like other macOS icons. -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g class="lay" opacity=".3" transform="translate(60 -36)">
    <use class="dr cg" href="#rim"/><use class="db cg" href="#body"/>
    <use class="r cp" href="#wave"/><use class="b cp" href="#wave"/>
  </g>
  <g class="lay" opacity=".42" transform="translate(40 -24)">
    <use class="dr cg" href="#rim"/><use class="db cg" href="#body"/>
    <use class="r cp" href="#wave"/><use class="b cp" href="#wave"/>
  </g>
  <g class="lay" opacity=".55" transform="translate(20 -12)">
    <use class="dr cg" href="#rim"/><use class="db cg" href="#body"/>
    <use class="r cp" href="#wave"/><use class="b cp" href="#wave"/>
  </g>
  <g class="lay gl" opacity=".4" filter="url(#glow)">
    <use class="db" href="#body"/>
    <use class="b" href="#wave"/>
  </g>
  <g class="lay fr" opacity=".9">
    <use class="dr" href="#rim"/><use class="dg" href="#gap"/><use class="dl" href="#line"/><use class="db" href="#body"/>
    <use class="r" href="#wave"/><use class="g" href="#wave"/><use class="l" href="#wave"/><use class="b" href="#wave"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="url(#edge)" stroke-width="6"/>
</svg>
