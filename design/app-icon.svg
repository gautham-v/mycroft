<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OpenDispatch app icon: an ice front with each piece trailing its own color (green dot, orange
       inner arc, pink outer arc) up-right, on a deep night-sky blue.
       Source for the PNGs in App/Openfeed/Resources/Assets.xcassets; regenerate with scripts/render-icons.sh. -->
  <style>
    use { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .lay { mix-blend-mode: screen; }
    .r { stroke-width: 90; }
    .g { stroke-width: 84; }
    .l { stroke-width: 79; }
    .b { stroke-width: 73; }
    .r.cg { stroke: #8dff5a; } .b.cg { stroke: #1f5a0c; }
    .r.co { stroke: #ff9a3a; } .b.co { stroke: #6a2405; }
    .r.cp { stroke: #ff5ad8; } .b.cp { stroke: #5a0c4c; }
    .fr .r { stroke: #eef4ff; } .fr .g { stroke: #16204a; } .fr .l { stroke: #d3e6ff; } .fr .b { stroke: url(#ice); }
    .gl .b { stroke: url(#ice); }
  </style>
  <defs>
    <!-- A round-capped point, not a stroked circle: Chrome punches a hole in a circle whose stroke is wider than its diameter. -->
    <path id="dot" d="M 0 0 h 0.01" transform="translate(317 707) scale(1.2)"/>
    <path id="inner" d="M 270 500 C 360 455 470 470 525 580 C 565 660 555 700 525 745"/>
    <path id="outer" d="M 300 273 C 470 302 610 340 700 480 C 770 590 755 680 706 745"/>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="240" y1="260" x2="780" y2="780">
      <stop offset="0" stop-color="#8cc3f2"/>
      <stop offset="0.6" stop-color="#b9c6f0"/>
      <stop offset="1" stop-color="#eadcf7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15234a"/>
      <stop offset="0.5" stop-color="#0c1533"/>
      <stop offset="1" stop-color="#060a1c"/>
    </linearGradient>
    <!-- Faint light along the top edge, like other macOS icons. -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-30 20)">
    <g class="lay" opacity=".3" transform="translate(60 -36)">
      <use class="r cg" href="#dot"/><use class="b cg" href="#dot"/>
      <use class="r co" href="#inner"/><use class="b co" href="#inner"/>
      <use class="r cp" href="#outer"/><use class="b cp" href="#outer"/>
    </g>
    <g class="lay" opacity=".42" transform="translate(40 -24)">
      <use class="r cg" href="#dot"/><use class="b cg" href="#dot"/>
      <use class="r co" href="#inner"/><use class="b co" href="#inner"/>
      <use class="r cp" href="#outer"/><use class="b cp" href="#outer"/>
    </g>
    <g class="lay" opacity=".55" transform="translate(20 -12)">
      <use class="r cg" href="#dot"/><use class="b cg" href="#dot"/>
      <use class="r co" href="#inner"/><use class="b co" href="#inner"/>
      <use class="r cp" href="#outer"/><use class="b cp" href="#outer"/>
    </g>
    <g class="lay gl" opacity=".45" filter="url(#glow)">
      <use class="b" href="#dot"/>
      <use class="b" href="#inner"/>
      <use class="b" href="#outer"/>
    </g>
    <g class="lay fr" opacity=".9">
      <use class="r" href="#dot"/><use class="g" href="#dot"/><use class="l" href="#dot"/><use class="b" href="#dot"/>
      <use class="r" href="#inner"/><use class="g" href="#inner"/><use class="l" href="#inner"/><use class="b" href="#inner"/>
      <use class="r" href="#outer"/><use class="g" href="#outer"/><use class="l" href="#outer"/><use class="b" href="#outer"/>
    </g>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="url(#edge)" stroke-width="6"/>
</svg>
