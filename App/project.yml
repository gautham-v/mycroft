name: Openfeed
options:
  bundleIdPrefix: com.gauthamv
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  OpenfeedCore:
    path: ../Core
  # In-app updates for the Mac app distributed as a DMG (scripts/release-mac.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"  # pinned; bump deliberately
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Openfeed:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Openfeed
        excludes:
          - "**/.DS_Store"
          - "Openfeed.entitlements"
          - "Info.plist"
    dependencies:
      - package: OpenfeedCore
      - package: Sparkle
        destinationFilters: [macOS]
    info:
      path: Openfeed/Info.plist
      properties:
        CFBundleDisplayName: OpenDispatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.news
        # Sparkle (macOS): the appcast is attached to the latest GitHub release; updates are signed
        # with the EdDSA key in the login keychain. The installer runs as an XPC service (sandbox).
        SUFeedURL: https://github.com/gautham-v/opendispatch/releases/latest/download/appcast.xml
        SUPublicEDKey: OyQttpMtNaMVzkFDCat5UJz3orsN82BUi1SJjP8HqFE=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        BGTaskSchedulerPermittedIdentifiers: [com.gauthamv.openfeed.refresh]
        UIBackgroundModes: [fetch, audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gauthamv.openfeed
            CFBundleURLSchemes: [opendispatch]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML File
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
    settings:
      base:
        PRODUCT_NAME: OpenDispatch
        PRODUCT_BUNDLE_IDENTIFIER: com.gauthamv.openfeed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 26TVJ92MLZ
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Openfeed/Openfeed.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # The multiplatform default is iOS's @executable_path/Frameworks; a Mac app keeps Sparkle in Contents/Frameworks.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
schemes:
  Openfeed:
    build:
      targets:
        Openfeed: all
    run:
      config: Debug
    archive:
      config: Release
